services:
    docker-proxy:
        image: tecnativa/docker-socket-proxy
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock   # 宿主机 socket 挂载给 proxy
        environment:
            # 根据你的实际需求开放 API 权限
            - CONTAINERS=1      # 允许列出/操作容器
            - POST=1            # 允许创建容器（如需 docker run / create）
            - DELETE=1          # 允许删除容器
            - IMAGES=1          # 允许镜像操作
            - NETWORKS=1        # 网络操作
            - VOLUMES=1
            - INFO=1            # 允许 /info 端点
            - AUTH=0            # 不开放认证相关
            - SECRETS=0
            - BUILD=0
            - COMMIT=0
            - SEARCH=0
            - EXEC=1            # 如需 exec 进入容器
            - SWARM=0
        ports:
            - "127.0.0.1:2375:2375"   # 仅本地访问，不对外暴露
        networks:
            - sail                # 与 laravel.test 同一网络

    laravel.test:
        build:
            context: './docker/8.4'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        working_dir: /var/www/html   # ✅ 就放这里（核心）
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
#            - '${APP_PORT:-80}:80'

            # Octane
            - '8080:8080'   # 添加这一行，将容器内部的 8080 端口映射到宿主机

            # Vite
            - '5173:5173'

            # WebSocket
            - '${REVERB_PORT:-6001}:6001'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            # 重点：告诉 Docker 客户端使用代理，而不是 /var/run/docker.sock
            DOCKER_HOST: 'tcp://docker-proxy:2375'   # 让 PHP 的 Docker 客户端使用这个地址
        volumes:
            - '.:/var/www/html'
            - './docker/8.4/supervisord.conf:/etc/supervisor/supervisord.conf'
            - './docker/8.4/octane.conf:/etc/supervisor/conf.d/octane.conf'
#            - './docker/8.4/ops-metrics.conf:/etc/supervisor/conf.d/ops-metrics.conf'
            - './docker/8.4/laravel-reverb.conf:/etc/supervisor/conf.d/laravel-reverb.conf'
            - './docker/8.4/laravel-worker.conf:/etc/supervisor/conf.d/laravel-worker.conf'
            - './docker/8.4/command.conf:/etc/supervisor/conf.d/command.conf'
            # 移除 volumes 中的 /var/run/docker.sock 挂载（不再需要）
        #            - '/var/run/docker.sock:/var/run/docker.sock'
        networks:
            - sail
        depends_on:
            - docker-proxy
            - mysql
            - redis
            - meilisearch
            - mailpit
            - selenium
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
            MYSQL_EXTRA_OPTIONS: '${MYSQL_EXTRA_OPTIONS:-}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    meilisearch:
        image: 'getmeili/meilisearch:latest'
        ports:
            - '${FORWARD_MEILISEARCH_PORT:-7700}:7700'
        environment:
            MEILI_NO_ANALYTICS: '${MEILISEARCH_NO_ANALYTICS:-false}'
        volumes:
            - 'sail-meilisearch:/meili_data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - wget
                - '--no-verbose'
                - '--spider'
                - 'http://127.0.0.1:7700/health'
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
    selenium:
        image: selenium/standalone-chromium
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        volumes:
            - '/dev/shm:/dev/shm'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
    sail-meilisearch:
        driver: local
