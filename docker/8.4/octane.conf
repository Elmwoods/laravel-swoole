; =========================
; Octane 进程管理
; =========================
[program:octane]

command=php artisan octane:start --server=swoole --host=0.0.0.0 --port=8080
; ❗ 修改点：
; - 移除 --watch（生产模式不需要）
; - 明确 server=swoole（避免默认不确定）
; - 保持 0.0.0.0（容器必须）

directory=/var/www/html
; ❗ 工作目录（必须）

autostart=true
; 容器启动自动执行

autorestart=true
; 崩溃自动重启（关键）

; user=root
; ❗ 推荐：和 Laravel Sail 用户一致

redirect_stderr=true
; 错误输出合并到 stdout

stdout_logfile=/var/www/html/storage/logs/octane.log
stderr_logfile=/var/www/html/storage/logs/octane-error.log
; ❗ Docker 推荐写 /tmp，避免权限问题

stopwaitsecs=3600
; 优雅停止等待时间（Octane 很重要）F

priority=1
startsecs=3
startretries=5
