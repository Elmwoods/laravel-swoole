[supervisord]
; =========================
; Supervisor 主进程配置
; =========================

nodaemon=true
; ❗ 必须：让 supervisor 在 Docker 中以前台模式运行
; 如果不加，容器会直接退出

; ❗ 不要设置 global user（很容易炸）
; user=root
; ← ❌ 删除这一行
; ⚠️ 可用，但推荐生产用 sail 用户

; ❗ 改这里（关键）
logfile=/tmp/supervisord.log
; supervisor 主日志

pidfile=/tmp/supervisord.pid
; supervisor PID 文件

loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock
; ❗ 解决 socket 问题
chmod=0777

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[include]
files=/etc/supervisor/conf.d/*.conf
