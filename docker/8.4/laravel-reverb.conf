[program:laravel-reverb]
# 定义一个被 Supervisor 管理的程序，名为 "laravel-reverb"
# 后续的配置都属于这个程序

process_name=%(program_name)s
# 设置实际运行时的进程名称
# %(program_name)s 会被替换为上面的程序名 "laravel-reverb"
# 这样当你在系统中看到该进程时，名字是 "laravel-reverb" 而不是一串随机数字

command=php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=6001
# 指定要启动的命令行：用 PHP 执行 Laravel 的 Artisan 命令，启动 Reverb 服务
# --host=0.0.0.0 表示监听所有网络接口（允许外部访问）
# --port=6001  表示监听 6001 端口（WebSocket 默认端口）

autostart=true
# 当 Supervisor 启动时，是否自动启动这个程序
# true 表示一旦 Supervisor 进程运行，就立即启动 laravel-reverb

autorestart=true
# 当程序意外退出时，是否自动重启
# true 表示无论程序因何原因退出（崩溃、被杀死等），都会尝试重新启动

user=www-data
# 使用哪个系统用户来运行这个命令
# www-data 是常见的 Web 服务器用户（如 Nginx/Apache），权限较低，安全性更好

redirect_stderr=true
# 是否将程序的标准错误（stderr）重定向到标准输出（stdout）
# true 表示错误信息会跟普通输出一起写入下面的日志文件，方便统一查看

stdout_logfile=/var/www/html/storage/logs/reverb.log
# 指定标准输出（包括可能重定向过来的错误）写入的日志文件路径
# 所有 Reverb 的运行日志都会记录到这个文件中，便于排查问题

stopwaitsecs=3600
# 发送停止信号后，等待进程自行退出的最长时间（单位：秒）
# 这里设为 3600 秒（1 小时），意思是 Supervisor 会给 Reverb 长达一小时的“善后时间”
# 用于让 Reverb 完成正在处理的 WebSocket 连接或消息，再优雅退出，避免数据丢失或客户端断连
